<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
	<head>
		<meta http-equiv="content-type" content="text/html; charset=UTF-8" />
		<script type="text/javascript">
		window.addEventListener('DOMContentLoaded', function() {
			// Log the full URL so we can see how the engine passes current pref values
			var el = document.createElement('p');
			el.style.fontSize = '10px';
			el.style.color = '#999';
			el.textContent = 'URL: ' + window.location.href;
			document.body.appendChild(el);

			// Attempt to restore radio state from query string
			var params = {};
			window.location.search.substring(1).split('&').forEach(function(pair) {
				var parts = pair.split('=');
				if (parts.length === 2) {
					params[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1]);
				}
			});
			['show-synonyms', 'show-inflections', 'show-examples', 'show-compounds', 'show-grammar'].forEach(function(name) {
				if (params[name] !== undefined) {
					document.querySelectorAll('input[name="' + name + '"]').forEach(function(radio) {
						radio.checked = (radio.value === params[name]);
					});
				}
			});
		});
		</script>
	</head>
	<body>
		<div id="copyright"></div>
		<hr />
		<div class="query">
			<input type="hidden" name="version" value="1" />
		</div>
		<div class="query" style="line-height: 150%">
			Synonyms:<br />
			<label><input type="radio" name="show-synonyms" value="1" checked="checked" /> Show</label><br />
			<label><input type="radio" name="show-synonyms" value="0" /> Hide</label><br />
			<hr />
			Inflections:<br />
			<label><input type="radio" name="show-inflections" value="1" checked="checked" /> Show</label><br />
			<label><input type="radio" name="show-inflections" value="0" /> Hide</label><br />
			<hr />
			Examples:<br />
			<label><input type="radio" name="show-examples" value="1" checked="checked" /> Show</label><br />
			<label><input type="radio" name="show-examples" value="0" /> Hide</label><br />
			<hr />
			Compound words:<br />
			<label><input type="radio" name="show-compounds" value="1" checked="checked" /> Show</label><br />
			<label><input type="radio" name="show-compounds" value="0" /> Hide</label><br />
			<hr />
			Grammar notation:<br />
			<label><input type="radio" name="show-grammar" value="1" /> Show</label><br />
			<label><input type="radio" name="show-grammar" value="0" checked="checked" /> Hide</label><br />
		</div>
	</body>
</html>
